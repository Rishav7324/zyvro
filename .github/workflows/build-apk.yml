name: Build Zyvro Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Zyvro
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Clean build
        run: ./gradlew clean --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # CI-only release signing: decode the upload keystore from secrets into
      # key.properties. Local builds without secrets keep working via the
      # debug-key fallback in app/build.gradle.kts. Never commit key.properties.
      - name: Prepare release keystore (CI only)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No release key secrets configured - build will use the debug-key fallback."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/zyvro-release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/zyvro-release.keystore"
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties
          echo "Release keystore prepared."

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify release signature
        run: |
          for APK in app/build/outputs/apk/release/*.apk; do
            [ -f "$APK" ] || continue
            echo "Verifying $APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" || \
            ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1 | xargs -I{} "$ANDROID_HOME/build-tools/{}/apksigner" verify --print-certs "$APK"
          done

      - name: Prepare branded release APK names
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cd app/build/outputs/apk/release/
          [ -f "app-arm64-v8a-release.apk" ] && cp -v "app-arm64-v8a-release.apk" "Zyvro-${TAG}-arm64-v8a.apk"
          [ -f "app-armeabi-v7a-release.apk" ] && cp -v "app-armeabi-v7a-release.apk" "Zyvro-${TAG}-armeabi-v7a.apk"
          [ -f "app-universal-release.apk" ] && cp -v "app-universal-release.apk" "Zyvro-${TAG}-universal.apk"
          ls -lh

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Zyvro-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release on version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
